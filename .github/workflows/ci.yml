name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      # The suite above imports source modules. This boots dist/, which is what
      # actually ships, and catches build-level breakage the suite cannot see.
      - run: npm run smoke

  deploy:
    # Only the default branch publishes, and only after the checks above pass.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

  # The mortality constants are generated from a live WHO endpoint, so the
  # committed values can silently drift from their source. This does not gate
  # merges -- an upstream outage is not a reason to block a CSS fix -- but a
  # regenerated fit that no longer matches what is committed should be visible.
  mortality-drift:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: python tools/fit_mortality.py
      - name: Report drift against committed constants
        run: |
          if git diff --quiet -- src/core/populations.ts; then
            echo "Constants match the current WHO data."
          else
            echo "::warning::Refitting against WHO produced different constants."
            git --no-pager diff -- src/core/populations.ts
          fi
